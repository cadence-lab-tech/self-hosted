# Checks of the package. On every pull request and push to main:
#
#   lint   shell linter (get-cadence.sh as POSIX sh), compose and Caddyfile
#          in both modes, the release package, the Helm chart rendered and
#          in parity with compose (ci/check-config.sh, helm lint), the
#          one-line installer under dash (ci/check-get-cadence.sh), the
#          signature verification of install.sh and upgrade.sh on stubs
#          (ci/check-verify.sh), the release pull request
#          (ci/check-release-pr.sh), the publication of the chart on a
#          stand-in helm (ci/check-publish-chart.sh), the digests
#          docker-compose.yml pins against the tag of VERSION in the registry
#          (ci/check-pins.sh: a moved tag fails it), the secret scan over
#          the history of the commit under check - not every ref of the
#          clone - with a self-check of gitleaks on a scratch repository
#          (ci/check-secrets.sh)
#   stack  the stack on the published images of VERSION, in proxy mode,
#          installed from the package of this commit - with clab of VERSION
#          from the tap in bin/, which its scripts run (decision 0057) - with
#          the one-line installer: sign-in, clab, MCP, backup and restore, the
#          off-machine copy to a stand-in S3 bucket and backup.sh verify
#          (ci/s3.sh; on images of v0.10.0 or newer, /api backup-s3)
#          (ci/check-stack.sh); with cosign, so the installer verifies the
#          signatures of the images of VERSION for real; once on an amd64
#          runner and once on an arm64 runner, the two platforms the images
#          are built for
#   external-db  the same stack on an external PostgreSQL (CHECK_DB=external,
#          ci/external-db.sh): a pgvector 18 server of its own with TLS and a
#          role that is no superuser; the refusals of the precheck, backup,
#          restore, the upgrade check and its rollback. Needs the images of
#          v0.10.0 or newer (/api dbcheck): for older VERSION it is skipped
#          with a notice
#
#   helm   the Helm chart in a kind cluster (ci/check-helm.sh): ingress-nginx,
#          an external PostgreSQL and a stand-in bucket, the secrets as
#          Secrets; the precheck, three replicas of the API, sign-in, MCP
#          through the Ingress, the bucket, Pod Security restricted for
#          every pod, upgrades. Needs the images of v0.14.0 or newer (*_FILE
#          since v0.13.0, the frontend image as uid 65532 on :8080 since
#          v0.14.0): for older VERSION it is skipped with a notice
#
#   airgap the closed network (ci/check-airgap.sh): clab server images save
#          of VERSION, then in docker:28-dind daemons without network load,
#          install, backup, restore and backup verify on the containerd
#          image store, and the refusal of the classic overlay2 storage.
#          The package of VERSION is the published release, or - while
#          there is none, as on a release pull request (release/vX.Y.Z),
#          whose release appears once it is merged - the package of this
#          commit built by ci/package.sh; its checksums.txt, unsigned, is
#          accepted by a stand-in cosign bound to its SHA-256, the images
#          are verified by the real cosign (CHECK_AIRGAP_PACKAGE=auto, the
#          default: release or checkout). Needs a clab of VERSION with clab
#          server images (the release after v0.14.1): for an older one it is
#          skipped with a note
#
#   upgrade  the upgrade between two versions (ci/check-upgrade.sh): FROM as
#          installed, TO as the package of this commit. On a release pull
#          request (a branch release/*) on its own: FROM is VERSION of the
#          base branch, TO is VERSION of the pull request; the same VERSION
#          is skipped with a notice. Run by hand, it takes the two versions
#          as inputs. Other pull requests and pushes to main do not run it.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: "Also check the upgrade from this version (vX.Y.Z), empty to skip"
        required: false
      upgrade_to:
        description: "...to this version (vX.Y.Z)"
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ci/check-config.sh renders the chart with it.
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: shellcheck
        run: |
          shellcheck *.sh ci/*.sh postgres/*.sh
          # curl | sh runs it under dash on Debian and Ubuntu: no bashisms.
          shellcheck -s sh get-cadence.sh
      - name: compose, Caddyfile, layout, release package
        run: ci/check-config.sh
      - name: one-line installer
        run: ci/check-get-cadence.sh
      - name: signature verification of install.sh and upgrade.sh
        run: ci/check-verify.sh
      - name: release pull request
        run: ci/check-release-pr.sh
      - name: publication of the chart
        run: ci/check-publish-chart.sh
      - name: pinned digests are the images of VERSION
        run: ci/check-pins.sh
      - name: no secrets in the history
        run: ci/check-secrets.sh

  # The same check on both architectures the images are built for. GitHub's
  # arm64 runners are free for public repositories; the two runs are
  # independent, so one architecture failing does not hide the other.
  stack:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Both images of VERSION must be published with a manifest for the
      # platform of this runner. Versions before v0.5.3 are amd64-only: for
      # them the arm64 runner prints a notice and skips the stack instead of
      # failing, so main stays green until VERSION moves on. From v0.5.3 a
      # missing platform is an error on either runner - a release that
      # dropped one would be caught here.
      - id: images
        name: images of VERSION exist for this runner
        run: |
          . ./ci/lib.sh
          v="$(tr -d '[:space:]' <VERSION)"
          case "$(uname -m)" in
          x86_64) platform=linux/amd64 ;;
          aarch64) platform=linux/arm64 ;;
          *) echo "::error::unexpected runner architecture $(uname -m)"; exit 1 ;;
          esac
          skip=false
          for image in sdlc-pipeline-backend sdlc-pipeline-frontend; do
            ref="ghcr.io/cadence-lab-tech/$image:$v"
            if ! manifest="$(docker manifest inspect --verbose "$ref" 2>&1)"; then
              echo "::error::$ref is not published: $manifest"
              exit 1
            fi
            platforms="$(jq -r 'if type == "array" then .[] else . end | .Descriptor.platform // empty | "\(.os)/\(.architecture)"' <<<"$manifest")"
            if grep -qxF "$platform" <<<"$platforms"; then
              echo "$ref has $platform"
            elif [ "$platform" = linux/arm64 ] && version_lt "$v" v0.5.3; then
              echo "::notice::$ref has no $platform manifest: images before v0.5.3 are amd64-only, the stack check on this runner is skipped"
              skip=true
            else
              echo "::error::$ref has no $platform manifest (published: $(tr '\n' ' ' <<<"$platforms"))"
              exit 1
            fi
          done
          echo "skip=$skip" >>"$GITHUB_OUTPUT"
      # The cosign of the release workflows (decision 0046): the installer
      # verifies the images of VERSION with it (CADENCE_VERIFY=auto).
      - uses: sigstore/cosign-installer@v4.1.2
        if: steps.images.outputs.skip != 'true'
        with:
          cosign-release: v3.1.3
      - name: stack on the images of VERSION
        if: steps.images.outputs.skip != 'true'
        run: ci/check-stack.sh

  # The external database (CLAB-127). Images before v0.10.0 have no /api
  # dbcheck: the job prints a notice and skips instead of failing, so a pull
  # request of the package that brings the mode stays green until the release
  # of the images catches up (the release pull request of v0.10.0 runs it).
  external-db:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: images
        name: images of VERSION have /api dbcheck
        run: |
          . ./ci/lib.sh
          v="$(tr -d '[:space:]' <VERSION)"
          if version_lt "$v" v0.10.0; then
            echo "::notice::VERSION is $v: its backend image has no /api dbcheck (v0.10.0+), the external database check is skipped"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - name: stack on an external PostgreSQL
        if: steps.images.outputs.skip != 'true'
        env:
          CHECK_DB: external
        run: ci/check-stack.sh

  # Secrets in files (CLAB-200): the installation moved to compose.secrets.yml
  # and *_FILE, with the bundled and the external database. Images before
  # v0.13.0 do not read *_FILE: the job prints a notice and skips, so the
  # pull request of the package stays green until the release of the images
  # catches up (the release pull request of v0.13.0 runs it).
  secrets-files:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: images
        name: images of VERSION read *_FILE
        run: |
          . ./ci/lib.sh
          v="$(tr -d '[:space:]' <VERSION)"
          if version_lt "$v" v0.13.0; then
            echo "::notice::VERSION is $v: its backend image reads no *_FILE (v0.13.0+), the check of secrets in files is skipped"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - name: stack on secrets in files
        if: steps.images.outputs.skip != 'true'
        env:
          CHECK_SECRETS: files
        run: ci/check-stack.sh
      - name: stack on secrets in files, external database
        if: steps.images.outputs.skip != 'true'
        env:
          CHECK_SECRETS: files
          CHECK_DB: external
          COMPOSE_PROJECT_NAME: cadence-check-ext
        run: ci/check-stack.sh

  # The Helm chart (CLAB-201) in kind. Images before v0.13.0 do not read
  # *_FILE, which the chart passes every secret by; the frontend image before
  # v0.14.0 runs as root on :80, and the chart runs ui as uid 65532 on :8080
  # under Pod Security restricted (CLAB-236). For an older VERSION the job
  # prints a notice and skips, so main stays green until the release of the
  # images catches up (the release pull request of v0.14.0 runs it).
  helm:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: images
        name: images of VERSION fit the chart
        run: |
          . ./ci/lib.sh
          v="$(tr -d '[:space:]' <VERSION)"
          if version_lt "$v" v0.14.0; then
            echo "::notice::VERSION is $v: the chart needs images of v0.14.0+ (*_FILE, the frontend image as uid 65532 on :8080), the check of the Helm chart is skipped"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.images.outputs.skip != 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - if: steps.images.outputs.skip != 'true'
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          install_only: true
      - name: the chart in kind
        if: steps.images.outputs.skip != 'true'
        run: ci/check-helm.sh

  airgap:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: the closed network in Docker daemons of its own
        run: ci/check-airgap.sh

  # The release pull request (release/vX.Y.Z, ci/release-pr.sh) moves VERSION:
  # the upgrade from the VERSION of main to it is checked there on its own.
  upgrade:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.upgrade_from != '') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: versions
        name: versions of the upgrade
        env:
          FROM_INPUT: ${{ inputs.upgrade_from }}
          TO_INPUT: ${{ inputs.upgrade_to }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            from="$(git show "origin/$BASE_REF:VERSION" | tr -d '[:space:]')"
            to="$(tr -d '[:space:]' <VERSION)"
            if [ "$from" = "$to" ]; then
              echo "::notice::VERSION of $BASE_REF and of the pull request is $to: no upgrade to check"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          else
            from="$FROM_INPUT"
            to="$TO_INPUT"
          fi
          echo "upgrade $from -> $to"
          {
            echo "from=$from"
            echo "to=$to"
            echo "skip=false"
          } >>"$GITHUB_OUTPUT"
      - name: upgrade between the versions
        if: steps.versions.outputs.skip != 'true'
        env:
          FROM: ${{ steps.versions.outputs.from }}
          TO: ${{ steps.versions.outputs.to }}
        run: ci/check-upgrade.sh "$FROM" "$TO"

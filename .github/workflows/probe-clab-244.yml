# Temporary (CLAB-244): how GHCR answers helm pull with the token of a
# workflow (packages: write, as the job "tag" of release.yml) for a chart
# package that does not exist yet. Read-only: helm pull, no push. Removed in
# the next commit of the branch.
name: probe-clab-244
on:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: helm pull with the token of the workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for target in "charts/cadence 0.13.0" "charts/cadence-probe-nonexistent 0.0.1" "sdlc-pipeline-backend 9.9.9"; do
            set -- $target
            echo "== ghcr.io/cadence-lab-tech/$1 --version $2"
            helm pull "oci://ghcr.io/cadence-lab-tech/$1" --version "$2" --destination "$RUNNER_TEMP" 2>&1 && echo "rc=0" || echo "rc=$?"
          done

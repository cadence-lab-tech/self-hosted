# Secrets in files instead of .env (docs/admin.md, "Secrets in files"):
# COMPOSE_FILE in .env adds this file right after the file of the mode, e.g.
#
#   COMPOSE_FILE=docker-compose.yml:compose.tls.yml:compose.secrets.yml:compose.override.yml
#
# and, with your own PostgreSQL, before compose.external-db.yml.
#
# The secrets every installation has come as Docker secrets from files in
# ./secrets: the password of the bundled database and the administrator
# token. Their values in .env stay empty - a value left there stops the
# service on start, naming both variables, instead of hiding behind the file.
# Without swarm a Docker secret is the file itself mounted at
# /run/secrets/<name>: its owner and mode on the host are what the container
# sees.
#
#   secrets/postgres_password  the password of the bundled database: read by
#                              postgres (uid 999 of its image) and by api
#                              and worker (uid 65532). Owner 65532, group
#                              999, mode 440.
#   secrets/admin_token        SDLC_ADMIN_TOKEN, read by api. Owner 65532,
#                              mode 400.
#
# Other secrets go as X_FILE=/secrets/<file> in .env (./secrets is mounted
# as /secrets) or as Docker secrets of compose.override.yml.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  admin_token:
    file: ./secrets/admin_token

services:
  postgres:
    secrets: [postgres_password]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  # api and worker read the same file through /secrets, not as a Docker
  # secret of theirs: compose.external-db.yml can turn the variable off, but
  # not take an attached secret away, and with an external database there
  # is no such file.
  api:
    secrets: [admin_token]
    environment:
      SDLC_DATABASE_PASSWORD_FILE: /secrets/postgres_password
      SDLC_ADMIN_TOKEN_FILE: /run/secrets/admin_token

  worker:
    environment:
      SDLC_DATABASE_PASSWORD_FILE: /secrets/postgres_password

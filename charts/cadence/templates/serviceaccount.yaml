{{- if .Values.serviceAccount.create }}
# The pods need no access to the Kubernetes API: no token is mounted. The
# annotations carry the role of IRSA (eks.amazonaws.com/role-arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cadence.serviceAccountName" . }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

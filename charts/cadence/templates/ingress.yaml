# The routes of the Caddyfile of the package: what the service handles goes
# to the API, everything else to the UI. Port 9090 is never routed.
{{- $api := printf "%s-api" (include "cadence.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cadence.fullname" . }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/v1" "/mcp" "/webhooks" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          {{- range list "/healthz" "/readyz" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cadence.fullname" . }}-ui
                port:
                  name: http

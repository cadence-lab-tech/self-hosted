{{- include "cadence.sections" . -}}
# The UI: static files served by Caddy inside the frontend image. The image
# runs as uid 65532 and the pod meets Pod Security "restricted", as api and
# worker do (docs/admin.md, "Kubernetes (Helm)"): Caddy listens on :8080
# only (CADENCE_UI_ADDRESS), the Service keeps port 80. It needs the frontend
# image of the same version (v0.14.0 or newer): an older one is root, on
# :80 and never answers on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cadence.fullname" . }}-ui
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "cadence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "cadence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cadence.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "cadence.podSecurityContext" . | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "cadence.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The Caddy binary of the image carries the file capability
          # cap_net_bind_service (:80 without root); with the capability
          # missing from the bounding set its exec fails with EPERM.
          # NET_BIND_SERVICE is the one capability "restricted" lets a
          # container add.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CADENCE_UI_ADDRESS
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Caddy keeps its state under /data and /config (fsGroup 65532).
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cadence.fullname" . }}-ui
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "cadence.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http

# CADENCE_DB=external: the database is your own PostgreSQL (Amazon RDS, Cloud
# SQL, Azure, your cluster) at SDLC_DATABASE_URL in .env (or in the file of
# SDLC_DATABASE_URL_FILE), not the postgres container. COMPOSE_FILE in .env
# adds this file after the file of the mode and after compose.secrets.yml;
# install.sh --external-db writes both (docs/admin.md, "External
# PostgreSQL").
#
# Needs Docker Compose 2.20 or newer (depends_on.required); the bundled mode
# keeps working on older ones.
services:
  # Never started: their profile is never enabled. Their volumes postgres and
  # pgdata are not created either.
  postgres:
    profiles: ["bundled-db"]
  pg-upgrade-dump:
    profiles: ["bundled-db"]
  pg-upgrade-load:
    profiles: ["bundled-db"]

  api:
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment: &external-db-env
      # The URL of .env, or of the file in SDLC_DATABASE_URL_FILE (a path
      # inside the container, e.g. /secrets/db-url): docker-compose.yml passes
      # that one on, and the service refuses to start with neither. The
      # scripts check the same before they run (check_db_mode).
      SDLC_DATABASE_URL: ${SDLC_DATABASE_URL:-}
      # Back to the value of .env: compose.secrets.yml, listed before this
      # file, points it at the password of the bundled database.
      SDLC_DATABASE_PASSWORD_FILE: ${SDLC_DATABASE_PASSWORD_FILE:-}

  worker:
    environment: *external-db-env

  # The client of backup.sh and restore.sh: pg_dump and psql of the newest
  # supported server version, in the network of the installation, with the
  # CA in /secrets. Started only by the scripts (docker compose run). The
  # password reaches it as PGPASSWORD, never on a command line.
  db-client:
    image: pgvector/pgvector:pg18-trixie
    profiles: ["tools"]
    entrypoint: []
    command: ["psql", "--version"]
    volumes:
      - ./secrets:/secrets:ro
